[package]
name = "switchboard-cli"
version = "1.0.35"
edition = "2024"
description = "A standalone CLI for interacting with Switchboard GraphQL instances"
license = "MIT"

[[bin]]
name = "switchboard"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a signed action hashes `JSON.stringify(input)` of exactly the
# bytes sent, so the key order the caller wrote must survive serialization.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

# Interactive prompts
dialoguer = "0.11"

# Output formatting
comfy-table = "7"
colored = "3"

# SVG → PNG rasterization
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"

# Config directories
dirs = "6"

# Operation signing (Renown identity: P-256 / SHA-256, did:key)
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
bs58 = "0.5"

# Error handling
anyhow = "1"
thiserror = "2"

# .phd file support (ZIP archives)
zip = "2"

# Shell completions
clap_complete = "4"

# WebSocket support (subscriptions)
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"

# Interactive REPL (readline, history, tab completion)
rustyline = "15"

# Self-update (download + extract + replace binary)
self-replace = "1"
flate2 = "1"
tar = "0.4"
uuid = { version = "1.22.0", features = ["v4"] }

# Used only on Unix to restore default SIGPIPE handling (see main.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
